# Add to /etc/hosts: <MASTER_IP>  rabbitmq.eats.local
# Login: eats / eatslab
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq
  namespace: eats-lab
  labels:
    app: rabbitmq
spec:
  ingressClassName: traefik
  rules:
    - host: rabbitmq.eats.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
