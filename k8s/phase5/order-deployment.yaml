# Phase 5 — order-service stand-in (same pattern as catalog).
# Industry default: replicas for HA + topology spread across nodes (not pinned to one worker).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: eats-lab
  labels:
    app: order
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Prefer even spread; still schedule if a node is down (soft HA).
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order
      containers:
        - name: order
          image: hashicorp/http-echo:1.0
          args: ["-text=order-service", "-listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
