# Phase 10 — ConfigMap as a mounted file (real apps often use envFrom OR files).
# http-echo can't expand env in args (no shell), so we serve MESSAGE via busybox httpd + HTML file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: eats-lab
  labels:
    app: catalog
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        version: v3-phase10
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: catalog
      containers:
        - name: catalog
          image: busybox:1.36
          command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: www
              mountPath: /www
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: www
          configMap:
            name: catalog-config
            items:
              - key: index.html
                path: index.html
