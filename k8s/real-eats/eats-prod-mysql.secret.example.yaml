# DO NOT commit real passwords.
# Create on cluster (example — password from prod /opt/kram/.env MYSQL_ROOT_PASSWORD):
#
#   kubectl -n eats-lab create secret generic eats-prod-mysql \
#     --from-literal=catalog-db='server=PROD_DROPLET_IP;port=3306;database=traditional_eats_catalog;user=root;password=YOUR_MYSQL_ROOT_PASSWORD;'
#
# Current prod droplet IP (DROPLET_IP_PRODUCTION): 104.236.116.189
apiVersion: v1
kind: Secret
metadata:
  name: eats-prod-mysql
  namespace: eats-lab
type: Opaque
stringData:
  catalog-db: "server=REPLACE_PROD_IP;port=3306;database=traditional_eats_catalog;user=root;password=REPLACE_ME;"
