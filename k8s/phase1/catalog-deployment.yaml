# catalog-service stand-in, replicas: 2.
# topologySpreadConstraints prefers 1 pod per node (worker1 + worker2 once master is cordoned).
# Swap image to your DOCR catalog image when ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: eats-lab
  labels:
    app: catalog
spec:
  replicas: 2
  # Phase 9 — rolling update: bring up a new Pod before killing an old one (no downtime).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        version: v2
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Prefer even spread; still schedule if a node is down (soft HA).
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: catalog
      containers:
        - name: catalog
          # Placeholder for Phase 1 learning — replace with real catalog image later.
          image: hashicorp/http-echo:1.0
          args: ["-text=catalog-service-v2", "-listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
