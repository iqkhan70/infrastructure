name: Deploy lab catalog

# git push → build → GHCR → SSH → kubectl apply / rollout
#
# Secrets:
#   SSH_PRIVATE_KEY   — same as bootstrap / Eats
#   GHCR_READ_TOKEN   — classic PAT with read:packages (and read:org if needed)
#                       Username = your GitHub username (e.g. iqkhan70)
#
# Why: GHCR packages stay private for pulls even when the git repo is public.
#      Cluster nodes need imagePullSecret=ghcr-cred to pull the image.

on:
  push:
    branches: [main, master]
    paths:
      - 'app/catalog/**'
      - 'k8s/cicd/**'
      - '.github/workflows/deploy-lab.yml'
  workflow_dispatch:

env:
  SSH_USER: root
  IMAGE_NAME: eats-lab-catalog

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/${REPO_LC}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/catalog
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Resolve master IP
        id: ip
        run: |
          IP=$(grep -v '^#' inventory/MASTER_IP | grep -v '^$' | head -1 | tr -d '[:space:]')
          if [ -z "$IP" ] || [ "$IP" = "YOUR_DROPLET_IP" ]; then
            echo "❌ Set inventory/MASTER_IP"
            exit 1
          fi
          echo "master_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY missing"
            exit 1
          fi
          if [ -z "${{ secrets.GHCR_READ_TOKEN }}" ]; then
            echo "❌ GHCR_READ_TOKEN missing"
            echo "   Create a classic PAT: GitHub → Settings → Developer settings → Personal access tokens"
            echo "   Scopes: read:packages"
            echo "   Add it as Actions secret GHCR_READ_TOKEN on this repo"
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to K3s
        env:
          MASTER_IP: ${{ steps.ip.outputs.master_ip }}
          FULL_IMAGE: ${{ steps.meta.outputs.full }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh-keyscan -H "$MASTER_IP" >> ~/.ssh/known_hosts

          scp -o StrictHostKeyChecking=no k8s/phase1/00-namespace.yaml \
            "${SSH_USER}@${MASTER_IP}:/tmp/eats-lab-ns.yaml"
          scp -o StrictHostKeyChecking=no k8s/cicd/catalog-deployment.yaml \
            "${SSH_USER}@${MASTER_IP}:/tmp/catalog-deploy.yaml"
          scp -o StrictHostKeyChecking=no k8s/phase1/catalog-service.yaml \
            "${SSH_USER}@${MASTER_IP}:/tmp/catalog-svc.yaml"
          scp -o StrictHostKeyChecking=no k8s/phase3/catalog-ingress.yaml \
            "${SSH_USER}@${MASTER_IP}:/tmp/catalog-ing.yaml"

          ssh -o StrictHostKeyChecking=no "${SSH_USER}@${MASTER_IP}" \
            "IMAGE='${FULL_IMAGE}' GHCR_USER='${GHCR_USER}' GHCR_READ_TOKEN='${GHCR_READ_TOKEN}' bash -s" <<'ENDSSH'
          set -euo pipefail
          kubectl apply -f /tmp/eats-lab-ns.yaml

          # Auth for private GHCR pulls (repo public ≠ package pullable)
          kubectl -n eats-lab create secret docker-registry ghcr-cred \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_READ_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Replace only the container image line (not imagePullSecrets)
          sed -E "s|^([[:space:]]+image:).*|\1 ${IMAGE}|" /tmp/catalog-deploy.yaml \
            > /tmp/catalog-deploy.live.yaml

          kubectl apply -f /tmp/catalog-deploy.live.yaml
          kubectl apply -f /tmp/catalog-svc.yaml
          kubectl apply -f /tmp/catalog-ing.yaml

          # Clear pods stuck in ImagePullBackOff from earlier attempts
          kubectl -n eats-lab delete pod -l app=catalog --force --grace-period=0 2>/dev/null || true

          kubectl -n eats-lab rollout status deployment/catalog --timeout=180s
          kubectl -n eats-lab get pods -l app=catalog -o wide
          kubectl -n eats-lab get deploy catalog -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          ENDSSH
