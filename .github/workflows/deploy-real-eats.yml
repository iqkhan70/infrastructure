name: Deploy real Eats (DOCR)

# Deploys one or more real Eats services from DOCR onto the lab cluster.
# Secrets: SSH_PRIVATE_KEY, DOCR_TOKEN (same DigitalOcean API token pattern as Eats)
#
# Add a service later:
#   1. Manifest under k8s/real-eats/<name>.yaml (Deployment app=<name>)
#   2. Entry in SERVICES_CATALOG + default tag below
#   3. Optional workflow_dispatch input for image tag override

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services, or all (catalog, identity)"
        required: true
        default: all
      catalog_image_tag:
        description: "DOCR tag for catalog (empty = catalog-service-latest)"
        required: false
        default: catalog-service-latest
      identity_image_tag:
        description: "DOCR tag for identity (empty = identity-service-latest)"
        required: false
        default: identity-service-latest

env:
  SSH_USER: root
  REGISTRY: registry.digitalocean.com
  IMAGE_REPO: cha-registry/kram
  # Keep CI ↔ droplet SSH alive during slow rollouts (avoids Broken pipe)
  SSH_OPTS: -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve master IP
        id: ip
        run: |
          IP=$(grep -v '^#' inventory/MASTER_IP | grep -v '^$' | head -1 | tr -d '[:space:]')
          if [ -z "$IP" ] || [ "$IP" = "YOUR_DROPLET_IP" ]; then
            echo "❌ Set inventory/MASTER_IP"
            exit 1
          fi
          echo "master_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY missing"; exit 1
          fi
          if [ -z "${{ secrets.DOCR_TOKEN }}" ]; then
            echo "❌ DOCR_TOKEN missing"; exit 1
          fi

      - name: Resolve service list
        id: services
        run: |
          set -euo pipefail
          # Known lab services (extend here when adding more)
          KNOWN="catalog identity"
          RAW="${{ inputs.services }}"
          RAW="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$RAW" ] || [ "$RAW" = "all" ]; then
            LIST="$KNOWN"
          else
            LIST="$(echo "$RAW" | tr ',' ' ')"
          fi
          RESOLVED=""
          for s in $LIST; do
            case " $KNOWN " in
              *" $s "*) RESOLVED="$RESOLVED $s" ;;
              *) echo "❌ Unknown service '$s'. Known: $KNOWN (or all)"; exit 1 ;;
            esac
          done
          RESOLVED="$(echo "$RESOLVED" | xargs)"
          echo "services=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Deploying: $RESOLVED"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy shared infra + selected services
        env:
          MASTER_IP: ${{ steps.ip.outputs.master_ip }}
          DOCR_TOKEN: ${{ secrets.DOCR_TOKEN }}
          SERVICES: ${{ steps.services.outputs.services }}
          CATALOG_IMAGE_TAG: ${{ inputs.catalog_image_tag }}
          IDENTITY_IMAGE_TAG: ${{ inputs.identity_image_tag }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          ssh-keyscan -H "$MASTER_IP" >> ~/.ssh/known_hosts

          remote() {
            # shellcheck disable=SC2086
            ssh $SSH_OPTS "${SSH_USER}@${MASTER_IP}" "$@"
          }

          COPY=(
            k8s/phase1/00-namespace.yaml
            k8s/real-eats/00-mysql-redis.yaml
            k8s/phase6/00-rabbitmq-secret.yaml
            k8s/phase6/rabbitmq-deployment.yaml
            k8s/phase6/rabbitmq-service.yaml
            k8s/phase6/rabbitmq-ingress.yaml
          )
          for s in $SERVICES; do
            COPY+=("k8s/real-eats/${s}.yaml")
          done
          # shellcheck disable=SC2086
          scp $SSH_OPTS "${COPY[@]}" "${SSH_USER}@${MASTER_IP}:/tmp/"

          tag_for() {
            case "$1" in
              catalog)  echo "${CATALOG_IMAGE_TAG:-catalog-service-latest}" ;;
              identity) echo "${IDENTITY_IMAGE_TAG:-identity-service-latest}" ;;
              *) echo "❌ No default tag for $1" >&2; return 1 ;;
            esac
          }

          needs_rabbit=0
          for s in $SERVICES; do
            case "$s" in
              identity) needs_rabbit=1 ;;
            esac
          done

          # --- Apply (short SSH): shared deps ---
          remote "DOCR_TOKEN='${DOCR_TOKEN}' NEEDS_RABBIT='${needs_rabbit}' bash -s" <<'ENDSSH'
          set -euo pipefail
          kubectl apply -f /tmp/00-namespace.yaml
          kubectl -n eats-lab create secret docker-registry docr-cred \
            --docker-server=registry.digitalocean.com \
            --docker-username="$DOCR_TOKEN" \
            --docker-password="$DOCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f /tmp/00-mysql-redis.yaml
          if [ "${NEEDS_RABBIT}" = "1" ]; then
            kubectl apply -f /tmp/00-rabbitmq-secret.yaml
            kubectl apply -f /tmp/rabbitmq-service.yaml
            kubectl apply -f /tmp/rabbitmq-ingress.yaml
            RABBIT_READY="$(kubectl -n eats-lab get deploy rabbitmq -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)"
            if [ "${RABBIT_READY:-0}" = "1" ]; then
              echo "rabbitmq already Ready — skip redeploy"
            else
              for p in $(kubectl -n eats-lab get pods -l app=rabbitmq --no-headers 2>/dev/null | awk '$2 !~ /^1\// {print $1}'); do
                kubectl -n eats-lab delete pod "$p" --force --grace-period=0 2>/dev/null || true
              done
              kubectl apply -f /tmp/rabbitmq-deployment.yaml
            fi
          fi
          ENDSSH

          wait_deploy() {
            local name="$1" timeout_s="${2:-300}"
            local deadline=$((SECONDS + timeout_s))
            echo "Waiting for deployment/${name} (up to ${timeout_s}s)..."
            while (( SECONDS < deadline )); do
              # 45s chunks + keepalives so GitHub↔droplet SSH does not idle-drop
              if remote "kubectl -n eats-lab rollout status deployment/${name} --timeout=45s"; then
                return 0
              fi
              echo "...still waiting on ${name} ($(date -u +%H:%M:%S))"
            done
            echo "❌ timed out waiting for deployment/${name}"
            remote "kubectl -n eats-lab get pods -l app=${name} -o wide; kubectl -n eats-lab describe deploy ${name} | tail -30" || true
            return 1
          }

          wait_deploy mysql 180
          wait_deploy redis 120
          if [ "$needs_rabbit" = "1" ]; then
            wait_deploy rabbitmq 240
          fi

          # --- Apply + wait each app (apply is short; wait is chunked) ---
          for s in $SERVICES; do
            TAG="$(tag_for "$s")"
            FULL_IMAGE="${REGISTRY}/${IMAGE_REPO}:${TAG}"
            echo "=== Deploying ${s} → ${FULL_IMAGE} ==="
            remote "FULL_IMAGE='${FULL_IMAGE}' SERVICE='${s}' bash -s" <<'ENDSSH'
            set -euo pipefail
            sed -E "s|^([[:space:]]+image:).*registry\\.digitalocean\\.com.*|\\1 ${FULL_IMAGE}|" \
              "/tmp/${SERVICE}.yaml" > "/tmp/${SERVICE}.live.yaml"
            kubectl apply -f "/tmp/${SERVICE}.live.yaml"
            # Drop long-stuck non-ready pods from prior failed rolls (e.g. ImagePullBackOff)
            for p in $(kubectl -n eats-lab get pods -l "app=${SERVICE}" --no-headers 2>/dev/null | awk '$2 !~ /^1\// && $3 ~ /BackOff|ErrImage|ImagePull/ {print $1}'); do
              echo "Deleting stuck pod: $p"
              kubectl -n eats-lab delete pod "$p" --force --grace-period=0 2>/dev/null || true
            done
            ENDSSH
            wait_deploy "$s" 420
            remote "kubectl -n eats-lab get deploy ${s} -o jsonpath='{.spec.template.spec.containers[0].image}{\"\\n\"}'"
          done

          remote "kubectl -n eats-lab get pods -o wide"
