name: Deploy real Eats catalog (DOCR)

# Pulls registry.digitalocean.com/cha-registry/kram:catalog-service onto the lab cluster.
# Secrets: SSH_PRIVATE_KEY, DOCR_TOKEN (same DigitalOcean API token pattern as Eats)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: DOCR image tag (e.g. catalog-service-production)
        required: true
        default: catalog-service-production

env:
  SSH_USER: root
  REGISTRY: registry.digitalocean.com
  IMAGE_REPO: cha-registry/kram

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve master IP
        id: ip
        run: |
          IP=$(grep -v '^#' inventory/MASTER_IP | grep -v '^$' | head -1 | tr -d '[:space:]')
          if [ -z "$IP" ] || [ "$IP" = "YOUR_DROPLET_IP" ]; then
            echo "❌ Set inventory/MASTER_IP"
            exit 1
          fi
          echo "master_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY missing"; exit 1
          fi
          if [ -z "${{ secrets.DOCR_TOKEN }}" ]; then
            echo "❌ DOCR_TOKEN missing"; exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy mysql, redis, catalog
        env:
          MASTER_IP: ${{ steps.ip.outputs.master_ip }}
          DOCR_TOKEN: ${{ secrets.DOCR_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh-keyscan -H "$MASTER_IP" >> ~/.ssh/known_hosts
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${IMAGE_TAG}"

          scp -o StrictHostKeyChecking=no \
            k8s/phase1/00-namespace.yaml \
            k8s/real-eats/00-mysql-redis.yaml \
            k8s/real-eats/catalog.yaml \
            "${SSH_USER}@${MASTER_IP}:/tmp/"

          ssh -o StrictHostKeyChecking=no "${SSH_USER}@${MASTER_IP}" \
            "FULL_IMAGE='${FULL_IMAGE}' DOCR_TOKEN='${DOCR_TOKEN}' bash -s" <<'ENDSSH'
          set -euo pipefail

          kubectl apply -f /tmp/00-namespace.yaml

          # DOCR pull auth (token as username AND password — same as Eats)
          kubectl -n eats-lab create secret docker-registry docr-cred \
            --docker-server=registry.digitalocean.com \
            --docker-username="$DOCR_TOKEN" \
            --docker-password="$DOCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f /tmp/00-mysql-redis.yaml

          # Pin image tag from workflow input
          sed -E "s|^([[:space:]]+image:).*registry.digitalocean.com.*|\1 ${FULL_IMAGE}|" \
            /tmp/catalog.yaml > /tmp/catalog.live.yaml
          kubectl apply -f /tmp/catalog.live.yaml

          echo "Waiting for mysql/redis..."
          kubectl -n eats-lab rollout status deployment/mysql --timeout=180s
          kubectl -n eats-lab rollout status deployment/redis --timeout=120s

          # Fresh pull after secret exists
          kubectl -n eats-lab delete pod -l app=catalog --force --grace-period=0 2>/dev/null || true
          kubectl -n eats-lab rollout status deployment/catalog --timeout=300s

          kubectl -n eats-lab get pods -o wide
          kubectl -n eats-lab get deploy catalog -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          ENDSSH
